{% extends 'base.html' %}

{% block title %}
    <title>Plotly Charts</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        .plotly-page { max-width: 1100px; margin: 32px auto; padding: 0 20px 60px; }
        .plotly-page h1 { color: #334a94; font-size: 1.6rem; margin-bottom: 6px; }
        .plotly-page p  { color: #7a8aaa; font-size: .9rem; margin-bottom: 32px; }
        .plotly-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        @media (max-width: 750px) { .plotly-grid { grid-template-columns: 1fr; } }
        .plotly-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(51,74,148,.09);
        }
        .plotly-card h2 {
            font-size: .9rem;
            font-weight: 700;
            color: #334a94;
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 10px;
        }
    </style>
{% endblock %}

{% block content %}
<div class="plotly-page">
    <h1 style="text-align: center; font-size: 3rem; margin-top: 20px; color: #1a203c;">Plotly Charts</h1>
    <p></p>
    <div class="plotly-grid">
        {% for title, chart_html in charts %}
        <div class="plotly-card">
            <h2>{{ title }}</h2>
            {{ chart_html | safe }}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
